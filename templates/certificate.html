<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Certificate of Completion</title>
    <style>
      @page {
        size: A4 portrait;
        margin: 24mm;
      }

      body {
        margin: 0;
        font-family: "Georgia", "Times New Roman", serif;
        background: #f5f7fb;
        color: #1f2937;
      }

      .certificate {
        width: 100%;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 40px 24px;
        box-sizing: border-box;
      }

      .certificate-card {
        width: 100%;
        max-width: 920px;
        background: #ffffff;
        border: 3px solid #c7b38a;
        box-shadow: 0 12px 35px rgba(15, 23, 42, 0.12);
        padding: 56px 48px 40px;
        text-align: center;
        position: relative;
      }

      .certificate-card::before,
      .certificate-card::after {
        content: "";
        position: absolute;
        inset: 18px;
        border: 1px solid #d9c69a;
        pointer-events: none;
      }

      .header {
        margin-bottom: 18px;
      }

      .eyebrow {
        color: #8b6f2a;
        font-size: 14px;
        letter-spacing: 0.22em;
        text-transform: uppercase;
        margin-bottom: 12px;
      }

      h1 {
        margin: 0;
        font-size: clamp(2.2rem, 3vw, 3rem);
        letter-spacing: 0.04em;
        color: #102a43;
      }

      .subtitle {
        margin: 22px 0 14px;
        font-size: 1.15rem;
        color: #475569;
      }

      .recipient {
        margin: 18px 0 10px;
        font-size: clamp(2rem, 2.4vw, 3rem);
        font-weight: 700;
        color: #102a43;
      }

      .course {
        margin: 14px 0 10px;
        font-size: clamp(1.3rem, 2vw, 2rem);
        color: #1f2937;
        font-weight: 600;
      }

      .details {
        margin-top: 28px;
        display: grid;
        grid-template-columns: repeat(2, minmax(180px, 1fr));
        gap: 18px 24px;
        text-align: left;
      }

      .detail {
        border-top: 1px solid #e5e7eb;
        padding-top: 12px;
      }

      .label {
        display: block;
        font-size: 0.72rem;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        color: #6b7280;
        margin-bottom: 6px;
      }

      .value {
        font-size: 1.05rem;
        color: #111827;
        font-weight: 600;
      }

      @media (max-width: 640px) {
        .certificate-card {
          padding: 36px 22px 28px;
        }

        .details {
          grid-template-columns: 1fr;
          text-align: center;
        }
      }
    </style>
  </head>
  <body>
    <div class="certificate">
      <div class="certificate-card">
        <div class="header">
          <div class="eyebrow">Official Recognition</div>
          <h1>Certificate of Completion</h1>
        </div>

        <p class="subtitle">This is to certify that</p>
        <div class="recipient">{{ name }}</div>

        <p class="subtitle">has successfully completed the course</p>
        <div class="course">{{ course }}</div>

        <div class="details">
          <div class="detail">
            <span class="label">Completion Date</span>
            <span class="value">{{ date }}</span>
          </div>
          <div class="detail">
            <span class="label">Certificate ID</span>
            <span class="value">{{ certificate_id }}</span>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
